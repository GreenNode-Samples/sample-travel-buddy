name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r src/backend/requirements.txt pytest ruff
      - name: Lint
        run: ruff check --select F,E9,B,UP,SIM --target-version py312 src tests
      - name: Run tests
        run: pytest -q
      - name: Syntax check frontend
        run: node --check src/frontend/app.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t travel-buddy:ci .
